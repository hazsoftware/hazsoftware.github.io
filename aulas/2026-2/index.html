<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aulas — 2026.2</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef1ee; --ink: #10161c; --ink-soft: #4b555c; --accent: #a35a0e; --rule: #ccd3cd;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1116; --ink: #e7ecee; --ink-soft: #97a4aa; --accent: #e8a13d; --rule: #263139; }
    }
    * { box-sizing: border-box; }
    body {
      font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
      background: var(--bg); color: var(--ink);
      max-width: 42rem; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6;
    }
    a { color: var(--accent); }
    .eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
    h1 { margin: .3rem 0 1.8rem; font-size: 1.5rem; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    li { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 16px; }
    li a { text-decoration: none; font-weight: 700; }
    li a:hover { text-decoration: underline; }
    .back { display:inline-block; margin-top: 2.4rem; font-size: .8rem; color: var(--ink-soft); text-decoration:none; }
  </style>
</head>
<body>
  <span class="eyebrow">aulas</span>
  <h1>2026.2</h1>
  <ul>
    <li><a href="./desenvolvimento-frontend/">Desenvolvimento Frontend</a></li>
  </ul>
  <a class="back" href="../">← aulas</a>
</body>
</html>
